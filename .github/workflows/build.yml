name: Build

on:
  push:
    branches:
      - master
      - stable
  workflow_dispatch:
  pull_request:

jobs:
  compile:
    name: Compile
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    strategy:
      matrix:
        os:
          - ubuntu
          - windows
        include:
           - os: windows
             ext: .exe
    steps:
      - uses: actions/checkout@v4
      - run: make all-clean && make all
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
              basic/basic${{ matrix.ext }}
              fracas/fracas${{ matrix.ext }}
              havilah/havilah${{ matrix.ext }}
              kingdoms/kingdoms${{ matrix.ext }}
              neworigins/neworigins${{ matrix.ext }}
              standard/standard${{ matrix.ext }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu
      - run: ./run-snapshots.sh
        working-directory: snapshot-tests

  unittest:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make unittest
      # gdb is NOT preinstalled on GitHub's ubuntu-latest image, so install it.
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      # Plain (non-sanitized) build: pre-existing, benign-on-x86 UB — the ISAAC
      # RNG's misaligned loads, AString's new[]/scalar-delete — must not fail CI.
      # Run under gdb so a genuine crash prints a symbolized backtrace (the build
      # already compiles with -g) instead of an opaque "exit code 139".
      # --return-child-result makes this step's exit status follow the test
      # binary's, so a real failure (or a crash) still fails the job; a clean run
      # exits 0 with no extra noise.
      - name: Run unit tests (backtrace on crash)
        run: gdb -batch -ex run -ex bt -ex quit --return-child-result ./unittest
        working-directory: unittest
