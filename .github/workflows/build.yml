name: Build

on:
  push:
    branches:
      - master
      - stable
  workflow_dispatch:
  pull_request:

jobs:
  compile:
    name: Compile
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    strategy:
      matrix:
        os:
          - ubuntu
          - windows
        include:
           - os: windows
             ext: .exe
    steps:
      - uses: actions/checkout@v4
      - run: make all-clean && make all
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
              basic/basic${{ matrix.ext }}
              fracas/fracas${{ matrix.ext }}
              havilah/havilah${{ matrix.ext }}
              kingdoms/kingdoms${{ matrix.ext }}
              neworigins/neworigins${{ matrix.ext }}
              standard/standard${{ matrix.ext }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu
      - run: ./run-snapshots.sh
        working-directory: snapshot-tests

  unittest:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build with AddressSanitizer + UBSan so a crash prints a symbolized
      # backtrace instead of an opaque "exit code 139". CFLAGS on the make
      # command line REPLACES the Makefile's CFLAGS, so we must repeat the
      # required -I/-std flags here; -Werror is dropped so sanitizer-related
      # warnings don't fail the build.
      - name: Build unit tests (with sanitizers)
        run: make unittest CFLAGS="-g -O1 -I. -I.. -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Run unit tests
        run: ./unittest
        working-directory: unittest
        env:
          # abort_on_error makes ASan crash loudly; detect_leaks=0 because the
          # engine intentionally leaks, and we only care about the segfault here.
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
